name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PRODUCT_NAME: Llama
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust-check:
    name: Rust — test, clippy, fmt
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all


  linux-gtk-check:
    name: Linux GTK — fmt, clippy, build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libgtk-4-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            llama-gtk/target/
          key: ${{ runner.os }}-cargo-gtk-${{ hashFiles('llama-gtk/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gtk-

      - name: cargo fmt
        run: cargo fmt --manifest-path llama-gtk/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path llama-gtk/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path llama-gtk/Cargo.toml

      - name: cargo build
        run: cargo build --manifest-path llama-gtk/Cargo.toml

  windows-gtk-check:
    name: Windows GTK — fmt, clippy, test, package
    runs-on: windows-latest
    env:
      PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER: x86_64-w64-mingw32-gcc
      CMAKE_CXX_COMPILER: x86_64-w64-mingw32-g++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            zip

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            llama-gtk/target/
          key: ${{ runner.os }}-cargo-gtk-${{ hashFiles('llama-gtk/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gtk-

      - name: cargo fmt
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:/bin"
          cargo fmt --manifest-path llama-gtk/Cargo.toml -- --check

      - name: cargo clippy
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:/bin"
          cargo clippy --manifest-path llama-gtk/Cargo.toml --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: cargo test
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:/bin"
          cargo test --manifest-path llama-gtk/Cargo.toml --target x86_64-pc-windows-gnu

      - name: Package portable ZIP
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:/bin"
          bash scripts/windows/package.sh 0.0.0 build/windows

  swift-build:
    name: Swift — build + test
    runs-on: macos-15
    needs: rust-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Build Rust core (release, for linking)
        run: cargo build --release -p llama-core-ffi

      - name: Build Swift (debug)
        run: |
          xcodebuild build \
            -scheme Llama \
            -configuration Debug \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Swift tests
        run: |
          xcodebuild test \
            -scheme Llama \
            -configuration Debug \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
