[package]
name = "llama-core"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dependencies]
memmap2 = "0.9"
percent-encoding = "2.3.2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
