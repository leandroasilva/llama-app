[package]
name = "llama-gtk"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
gtk4 = "0.11"
llama-core = { path = "../llama-core", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }
